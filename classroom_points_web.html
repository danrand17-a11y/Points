<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --chalk: #1c2f52;
    --chalk-light: #2c4570;
    --chalk-lighter: #3f5a8a;
    --gold: #d4af6a;
    --gold-dark: #b8873a;
    --paper: #f6f1e4;
    --paper-dark: #e6dcc0;
    --coral: #a13d34;
    --coral-dark: #7a2e27;
    --ink: #22211b;
    --muted: #7a7261;
    --bg: #f8f4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: var(--chalk);
    color: var(--paper);
    padding: 20px 20px 16px;
    border-radius: 0 0 18px 18px;
    text-align: center;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.3px;
  }
  header .sub { font-size: 13px; color: #cfd9d2; margin-bottom: 16px; }
  header .logo-img {
    display: block;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin: 0 auto 10px;
  }
  header .header-divider {
    height: 1px;
    background: rgba(212,175,106,0.4);
    margin: 0 4px 14px;
  }

  .tabs {
    display: flex;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #cfd9d2;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 14px;
    padding: 9px 0;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: var(--gold); color: #2b1f08; }

  main { flex: 1; padding: 18px 16px 100px; }

  .section-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 4px 14px;
  }
  .section-row h2 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    margin: 0;
    color: var(--muted);
    font-weight: 600;
  }
  .manage-toggle {
    border: 1.5px solid var(--paper-dark);
    background: #fff;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .manage-toggle.on { background: var(--coral); color: #fff; border-color: var(--coral); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .card {
    background: var(--paper);
    border-radius: 16px;
    padding: 14px 14px 12px;
    position: relative;
    border: 1px solid var(--paper-dark);
  }
  .card .name {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 15.5px;
    margin: 0 0 8px;
    padding-right: 20px;
    word-break: break-word;
  }
  .points-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 12px; }
  .points-num {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--gold-dark);
    line-height: 1;
  }
  .points-label { font-size: 12px; color: var(--muted); }

  .stepper { display: flex; gap: 8px; }
  .step-btn {
    flex: 1;
    border: none;
    height: 38px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s;
  }
  .step-btn:active { transform: scale(0.92); }
  .step-btn.minus { background: var(--coral); }
  .step-btn.plus { background: var(--chalk-light); }

  .del-btn {
    position: absolute;
    top: 10px; right: 10px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--coral);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .manage-on .del-btn { display: flex; }

  .pin-display {
    display: none;
    font-size: 11.5px;
    color: var(--muted);
    margin: -4px 0 8px;
    letter-spacing: 1px;
  }
  .manage-on .pin-display { display: block; }

  .add-tile {
    border: 2px dashed var(--paper-dark);
    border-radius: 16px;
    background: transparent;
    color: var(--muted);
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 14px;
    min-height: 96px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  .shop-item {
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .shop-item .info { flex: 1; }
  .shop-item .iname {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 15px;
  }
  .cost-badge {
    display: inline-block;
    margin-top: 3px;
    background: var(--gold);
    color: #2b1f08;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .give-btn {
    border: none;
    background: var(--chalk);
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
  }
  .give-btn:disabled { opacity: 0.45; cursor: default; }
  .shop-del {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--coral);
    color: #fff;
    font-size: 12px;
    display: none;
    align-items: center; justify-content: center;
    cursor: pointer;
  }
  .manage-on .shop-del { display: flex; }

  .add-form-row {
    background: #fff;
    border: 1.5px solid var(--paper-dark);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .add-form-row input {
    border: 1.5px solid var(--paper-dark);
    border-radius: 9px;
    padding: 9px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: var(--bg);
  }
  .add-form-row input[name="pname"] { flex: 1; min-width: 0; }
  .add-form-row input[name="pcost"] { width: 64px; }
  .add-form-row button {
    border: none;
    background: var(--gold);
    color: #2b1f08;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 14px;
    border-radius: 9px;
    padding: 0 16px;
    cursor: pointer;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 20px;
  }

  .request-card {
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .request-card .rq-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .request-card .rq-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; }
  .request-card .rq-item { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .rq-actions { display: flex; gap: 8px; }
  .rq-btn {
    flex: 1;
    border: none;
    padding: 9px 0;
    border-radius: 10px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    color: #fff;
  }
  .rq-btn.approve { background: var(--chalk-light); }
  .rq-btn.deny { background: var(--coral); }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    margin-left: 4px;
    vertical-align: middle;
  }

  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(20,20,15,0.45);
    display: none;
    align-items: flex-end;
    z-index: 40;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: #fff;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px 26px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .sheet h3 {
    font-family: 'Playfair Display', serif;
    margin: 0 0 4px;
    font-size: 17px;
  }
  .sheet .item-cost-note { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .sheet-close {
    display: block;
    margin: 14px auto 0;
    border: none;
    background: var(--bg);
    color: var(--muted);
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  .kid-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 50px 24px 40px;
  }
  .kid-view .kid-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 22px;
  }
  .kid-view .kid-points {
    font-family: 'Playfair Display', serif;
    font-size: 76px;
    font-weight: 800;
    color: var(--gold-dark);
    line-height: 1;
  }
  .kid-view .kid-points-label {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
    margin-bottom: 30px;
  }
  .kid-view .kid-shop-title {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .kid-view .kid-shop-list, .kid-view .kid-requests-list {
    width: 100%;
    max-width: 320px;
  }
  .kid-shop-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px solid var(--paper-dark);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    gap: 10px;
  }
  .kid-shop-row .kn { font-weight: 600; font-family: 'Playfair Display', serif; text-align: left; }
  .kid-shop-row .kc { color: var(--gold-dark); font-weight: 700; white-space: nowrap; }
  .kid-req-btn {
    border: none;
    background: var(--chalk);
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .kid-req-btn:disabled { opacity: 0.4; cursor: default; }
  .kid-req-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .kid-req-row .kw { color: var(--muted); }
  .kid-cancel-btn {
    border: none;
    background: var(--coral);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .kid-view .kid-note {
    margin-top: 26px;
    font-size: 12.5px;
    color: var(--muted);
    max-width: 280px;
  }

  .link-btn {
    border: none;
    background: var(--chalk-light);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 8px;
    cursor: pointer;
    display: none;
    margin-top: 8px;
  }
  .manage-on .link-btn { display: inline-block; }

  .lock-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 24px 40px;
  }
  .lock-label {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .lock-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; max-width: 260px; }
  .pin-input {
    width: 160px;
    text-align: center;
    letter-spacing: 6px;
    font-size: 22px;
    font-family: 'Playfair Display', serif;
    padding: 12px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--paper-dark);
    background: var(--paper);
    margin-bottom: 14px;
  }
  .pin-submit {
    border: none;
    background: var(--chalk);
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 15px;
    padding: 11px 28px;
    border-radius: 12px;
    cursor: pointer;
  }
  .pin-error { color: var(--coral-dark); font-size: 13px; margin-top: 14px; }

  .pin-row { text-align: center; margin-top: 24px; }
  .pin-settings-btn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
  }
  .pin-input-sheet {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--paper-dark);
    background: var(--bg);
    font-size: 15px;
    margin-bottom: 10px;
    letter-spacing: 3px;
  }

  .setup-view { padding: 40px 24px; text-align: center; }
  .setup-view h2 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 10px; }
  .setup-view p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .setup-view code { background: var(--paper); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
</style>
</head>

let manageMode = false;
let loaded = false;
let pinUnlocked = false;
let busy = false;

// ---- Student-side state (kid view) ----
let kidUnlocked = false;
let kidData = null; // { id, name, points, shopItems, myRequests }

const viewStudentId = new URLSearchParams(window.location.search).get('student');

function studentLink(id) {
  return `${window.location.origin}${window.location.pathname}?student=${id}`;
}

async function apiCall(params) {
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  url.searchParams.set('_', Date.now()); // avoid cached responses
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('Network error');
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function withBusy(fn) {
  if (busy) return;
  busy = true;
  try {
    await fn();
  } catch (e) {
    showToast("Couldn't reach the sheet — check your connection");
  } finally {
    busy = false;
  }
}

/* ======================= INIT / ROUTING ======================= */

async function loadState() {
  if (!API_URL || API_URL.indexOf('PASTE_YOUR') === 0) {
    document.getElementById('main').innerHTML = `
      <div class="setup-view">
        <h2>Almost there</h2>
        <p>This copy of the app isn't connected to your Google Sheet yet.
        Open this file, find <code>API_URL</code> near the top of the script,
        and paste in your Apps Script web app link.</p>
      </div>`;
    return;
  }

  if (viewStudentId) {
    document.getElementById('tabsRow').style.display = 'none';
    document.querySelector('header h1').textContent = 'My Points';
    document.querySelector('header .sub').textContent = 'Ask your teacher to make changes.';
    routeKid();
    return;
  }

  try {
    const data = await apiCall({ action: 'getData' });
    applyTeacherData(data);
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty">Couldn't load your class right now. Check your internet connection and reload.</div>`;
    return;
  }
  loaded = true;
  if (state.pin && !pinUnlocked) {
    renderLockScreen();
  } else {
    render();
  }
}

function applyTeacherData(data) {
  if (data.students) state.students = data.students;
  if (data.shopItems) state.shopItems = data.shopItems;
  if (data.requests) state.requests = data.requests;
  state.pin = data.pin || null;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

/* ======================= TEACHER DASHBOARD ======================= */

function render() {
  if (!loaded) return;
  const main = document.getElementById('main');
  if (activeTab === 'students') main.innerHTML = renderStudents();
  else if (activeTab === 'shop') main.innerHTML = renderShop();
  else main.innerHTML = renderRequestsTab();

  main.innerHTML += `<div class="pin-row"><button id="pinSettingsBtn" class="pin-settings-btn">${state.pin ? 'Change PIN' : 'Set a PIN'}</button></div>`;
  attachHandlers();
  updateRequestBadge();
  const pinBtn = document.getElementById('pinSettingsBtn');
  if (pinBtn) pinBtn.onclick = openPinSheet;
}

function updateRequestBadge() {
  const badge = document.getElementById('reqBadge');
  const count = state.requests.length;
  if (count > 0) {
    badge.style.display = 'inline-flex';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
}

function renderStudents() {
  let html = `<div class="section-row"><h2>${state.students.length} student${state.students.length === 1 ? '' : 's'}</h2>
    <button class="manage-toggle ${manageMode ? 'on' : ''}" id="manageBtn">${manageMode ? 'Done' : 'Edit'}</button></div>`;
  html += `<div class="grid ${manageMode ? 'manage-on' : ''}">`;
  state.students.forEach(s => {
    html += `
      <div class="card">
        <button class="del-btn" data-del-student="${s.id}">✕</button>
        <p class="name">${escapeHtml(s.name)}</p>
        <div class="pin-display">${s.pin ? 'PIN: ' + escapeHtml(s.pin) : 'No PIN set yet'}</div>
        <div class="points-row">
          <span class="points-num">${s.points}</span>
          <span class="points-label">pts</span>
        </div>
        <div class="stepper">
          <button class="step-btn minus" data-adjust="${s.id}" data-delta="-1">−</button>
          <button class="step-btn plus" data-adjust="${s.id}" data-delta="1">+</button>
        </div>
        <button class="link-btn" data-link="${s.id}">Copy his tap-link</button>
      </div>`;
  });
  html += `<button class="add-tile" id="addStudentTile">+ Add student</button>`;
  html += `</div>`;
  html += `<div id="addStudentForm"></div>`;
  html += `<div style="text-align:center; margin-top:14px;"><button id="pasteListBtn" class="pin-settings-btn">Paste a class list instead</button></div>`;
  html += `<div id="pasteListForm"></div>`;
  return html;
}

function renderShop() {
  let html = `<div class="section-row"><h2>${state.shopItems.length} item${state.shopItems.length === 1 ? '' : 's'}</h2>
    <button class="manage-toggle ${manageMode ? 'on' : ''}" id="manageBtn">${manageMode ? 'Done' : 'Edit'}</button></div>`;
  html += `<div class="${manageMode ? 'manage-on' : ''}">`;
  if (state.shopItems.length === 0) {
    html += `<div class="empty">No shop items yet. Add something students can spend points on.</div>`;
  }
  state.shopItems.forEach(item => {
    html += `
      <div class="shop-item">
        <div class="info">
          <div class="iname">${escapeHtml(item.name)}</div>
          <span class="cost-badge">${item.cost} pts</span>
        </div>
        <button class="shop-del" data-del-item="${item.id}">✕</button>
        <button class="give-btn" data-give="${item.id}">Give</button>
      </div>`;
  });
  html += `</div>`;
  html += `<button class="add-tile" id="addItemTile" style="width:100%;margin-top:6px;">+ Add shop item</button>`;
  html += `<div id="addItemForm"></div>`;
  return html;
}

function renderRequestsTab() {
  let html = `<div class="section-row"><h2>${state.requests.length} pending</h2></div>`;
  if (state.requests.length === 0) {
    html += `<div class="empty">No requests waiting on you right now.</div>`;
    return html;
  }
  state.requests.forEach(r => {
    const student = state.students.find(s => s.id === r.studentId);
    const item = state.shopItems.find(i => i.id === r.itemId);
    html += `
      <div class="request-card">
        <div class="rq-top">
          <div>
            <div class="rq-name">${escapeHtml(student ? student.name : 'Unknown student')}</div>
            <div class="rq-item">wants: ${escapeHtml(item ? item.name : 'Unknown item')} (${item ? item.cost : '?'} pts)</div>
          </div>
        </div>
        <div class="rq-actions">
          <button class="rq-btn approve" data-approve="${r.id}">Approve</button>
          <button class="rq-btn deny" data-deny="${r.id}">Deny</button>
        </div>
      </div>`;
  });
  return html;
}

function attachHandlers() {
  const manageBtn = document.getElementById('manageBtn');
  if (manageBtn) manageBtn.onclick = () => { manageMode = !manageMode; render(); };

  document.querySelectorAll('[data-adjust]').forEach(btn => {
    btn.onclick = () => withBusy(async () => {
      const id = btn.getAttribute('data-adjust');
      const delta = btn.getAttribute('data-delta');
      applyTeacherData(await apiCall({ action: 'adjustPoints', id, delta }));
      render();
    });
  });

  document.querySelectorAll('[data-del-student]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-student');
      const student = state.students.find(s => s.id === id);
      if (student && confirm(`Remove ${student.name}?`)) {
        withBusy(async () => {
          applyTeacherData(await apiCall({ action: 'deleteStudent', id }));
          render();
        });
      }
    };
  });

  document.querySelectorAll('[data-del-item]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-item');
      const item = state.shopItems.find(i => i.id === id);
      if (item && confirm(`Remove ${item.name}?`)) {
        withBusy(async () => {
          applyTeacherData(await apiCall({ action: 'deleteItem', id }));
          render();
        });
      }
    };
  });

  document.querySelectorAll('[data-give]').forEach(btn => {
    btn.onclick = () => openGiveSheet(btn.getAttribute('data-give'));
  });

  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.onclick = () => withBusy(async () => {
      applyTeacherData(await apiCall({ action: 'approveRequest', id: btn.getAttribute('data-approve') }));
      render();
      showToast('Approved');
    });
  });

  document.querySelectorAll('[data-deny]').forEach(btn => {
    btn.onclick = () => withBusy(async () => {
      applyTeacherData(await apiCall({ action: 'denyRequest', id: btn.getAttribute('data-deny') }));
      render();
      showToast('Denied');
    });
  });

  document.querySelectorAll('[data-link]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-link');
      const url = studentLink(id);
      try {
        await navigator.clipboard.writeText(url);
        showToast('Link copied — write it to his NFC card');
      } catch (e) {
        prompt('Copy this link for his NFC card:', url);
      }
    };
  });

  const addStudentTile = document.getElementById('addStudentTile');
  if (addStudentTile) addStudentTile.onclick = showAddStudentForm;

  const pasteListBtn = document.getElementById('pasteListBtn');
  if (pasteListBtn) pasteListBtn.onclick = showPasteListForm;

  const addItemTile = document.getElementById('addItemTile');
  if (addItemTile) addItemTile.onclick = showAddItemForm;
}

function showAddStudentForm() {
  const container = document.getElementById('addStudentForm');
  container.innerHTML = `
    <div class="add-form-row" style="margin-top:12px;">
      <input type="text" name="pname" placeholder="Student name" autofocus>
      <button id="saveStudentBtn">Add</button>
    </div>`;
  const input = container.querySelector('input');
  input.focus();
  const save = () => {
    const name = input.value.trim();
    if (!name) return;
    withBusy(async () => {
      applyTeacherData(await apiCall({ action: 'addStudent', name }));
      render();
    });
  };
  container.querySelector('#saveStudentBtn').onclick = save;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
}

function showPasteListForm() {
  const container = document.getElementById('pasteListForm');
  if (container.innerHTML) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <div style="margin-top:10px;">
      <textarea id="classListInput" rows="8" placeholder="One student name per line" style="width:100%; border:1.5px solid var(--paper-dark); border-radius:10px; padding:10px; font-family:'Inter',sans-serif; font-size:14px; background:var(--bg);"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="importListBtn" class="give-btn" style="flex:1;">Add all</button>
      </div>
      <p id="importProgress" style="font-size:12.5px; color:var(--muted); margin-top:8px; display:none;"></p>
    </div>`;
  document.getElementById('classListInput').focus();
  document.getElementById('importListBtn').onclick = () => withBusy(async () => {
    const raw = document.getElementById('classListInput').value;
    const names = raw.split('\n')
      .map(line => line.replace(/\s+\d+\s*$/, '').trim())
      .filter(n => n);
    if (!names.length) return;
    const progress = document.getElementById('importProgress');
    progress.style.display = 'block';
    const chunkSize = 15;
    for (let i = 0; i < names.length; i += chunkSize) {
      const chunk = names.slice(i, i + chunkSize);
      progress.textContent = `Adding ${Math.min(i + chunkSize, names.length)} of ${names.length}...`;
      applyTeacherData(await apiCall({ action: 'addStudentsBulk', names: chunk.join('\n') }));
    }
    showToast(`Added ${names.length} students`);
    render();
  });
}

function showAddItemForm() {
  const container = document.getElementById('addItemForm');
  container.innerHTML = `
    <div class="add-form-row" style="margin-top:12px;">
      <input type="text" name="pname" placeholder="Reward name">
      <input type="number" name="pcost" placeholder="Pts" min="1">
      <button id="saveItemBtn">Add</button>
    </div>`;
  const nameInput = container.querySelector('input[name="pname"]');
  const costInput = container.querySelector('input[name="pcost"]');
  nameInput.focus();
  const save = () => {
    const name = nameInput.value.trim();
    const cost = parseInt(costInput.value, 10);
    if (!name || !cost || cost < 1) return;
    withBusy(async () => {
      applyTeacherData(await apiCall({ action: 'addItem', name, cost }));
      render();
    });
  };
  container.querySelector('#saveItemBtn').onclick = save;
  [nameInput, costInput].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); }));
}

function openGiveSheet(itemId) {
  const item = state.shopItems.find(i => i.id === itemId);
  if (!item) return;
  const sheet = document.getElementById('sheet');
  if (state.students.length === 0) {
    sheet.innerHTML = `<h3>${escapeHtml(item.name)}</h3><p class="item-cost-note">Add a student first before redeeming rewards.</p>
      <button class="sheet-close" id="closeSheet">Close</button>`;
  } else {
    let rows = state.students.map(s => {
      const can = s.points >= item.cost;
      return `<div class="request-card" style="display:flex;justify-content:space-between;align-items:center;">
        <span class="rq-name">${escapeHtml(s.name)} <span style="color:var(--muted);font-weight:400;font-size:12.5px;">(${s.points} pts)</span></span>
        <button class="give-btn" ${can ? '' : 'disabled'} data-redeem-student="${s.id}">Give</button>
      </div>`;
    }).join('');
    sheet.innerHTML = `<h3>${escapeHtml(item.name)}</h3>
      <p class="item-cost-note">Costs ${item.cost} pts. Choose who's spending them.</p>
      ${rows}
      <button class="sheet-close" id="closeSheet">Cancel</button>`;
  }
  document.getElementById('sheetBackdrop').classList.add('open');
  sheet.querySelectorAll('[data-redeem-student]').forEach(row => {
    row.onclick = () => {
      const sid = row.getAttribute('data-redeem-student');
      withBusy(async () => {
        applyTeacherData(await apiCall({ action: 'redeem', studentId: sid, itemId: item.id }));
        const student = state.students.find(s => s.id === sid);
        closeSheet();
        render();
        showToast(`${student.name} redeemed ${item.name} — ${student.points} pts left`);
      });
    };
  });
  sheet.querySelector('#closeSheet').onclick = closeSheet;
}

function closeSheet() {
  document.getElementById('sheetBackdrop').classList.remove('open');
}

document.getElementById('sheetBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'sheetBackdrop') closeSheet();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.getAttribute('data-tab');
    manageMode = false;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

function renderLockScreen() {
  document.getElementById('tabsRow').style.display = 'none';
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="lock-view">
      <p class="lock-label">Enter your PIN</p>
      <input type="password" inputmode="numeric" id="pinInput" class="pin-input" maxlength="8">
      <button id="pinSubmit" class="pin-submit">Unlock</button>
      <p class="pin-error" id="pinError" style="display:none;">Wrong PIN, try again.</p>
    </div>`;
  const input = document.getElementById('pinInput');
  input.focus();
  const tryUnlock = () => {
    if (input.value === state.pin) {
      pinUnlocked = true;
      document.getElementById('tabsRow').style.display = '';
      render();
    } else {
      document.getElementById('pinError').style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('pinSubmit').onclick = tryUnlock;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
}

function openPinSheet() {
  const sheet = document.getElementById('sheet');
  const hasPin = !!state.pin;
  sheet.innerHTML = `
    <h3>${hasPin ? 'Change PIN' : 'Set a PIN'}</h3>
    <p class="item-cost-note">${hasPin ? "This locks your dashboard so students can't get into the edit controls." : "Add a PIN so a boy who finds your link can only see his own points, not the controls."}</p>
    ${hasPin ? '<input type="password" inputmode="numeric" id="curPin" placeholder="Current PIN" class="pin-input-sheet">' : ''}
    <input type="password" inputmode="numeric" id="newPin" placeholder="New PIN (4+ characters)" class="pin-input-sheet">
    <input type="password" inputmode="numeric" id="confirmPin" placeholder="Confirm new PIN" class="pin-input-sheet">
    <button class="give-btn" id="savePinBtn" style="width:100%;margin-top:2px;">${hasPin ? 'Update PIN' : 'Save PIN'}</button>
    ${hasPin ? '<button class="sheet-close" id="removePinBtn">Remove PIN</button>' : ''}
    <button class="sheet-close" id="closeSheet">Cancel</button>
  `;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('savePinBtn').onclick = () => {
    if (hasPin && document.getElementById('curPin').value !== state.pin) {
      showToast('Current PIN is wrong');
      return;
    }
    const np = document.getElementById('newPin').value;
    const cp = document.getElementById('confirmPin').value;
    if (np.length < 4) { showToast('PIN needs at least 4 characters'); return; }
    if (np !== cp) { showToast("PINs don't match"); return; }
    withBusy(async () => {
      applyTeacherData(await apiCall({ action: 'setPin', pin: np }));
      closeSheet();
      render();
      showToast('PIN saved');
    });
  };
  if (hasPin) {
    document.getElementById('removePinBtn').onclick = () => {
      if (confirm('Remove the PIN? Anyone with your link could then open the dashboard.')) {
        withBusy(async () => {
          applyTeacherData(await apiCall({ action: 'setPin', pin: '' }));
          closeSheet();
          render();
          showToast('PIN removed');
        });
      }
    };
  }
  document.getElementById('closeSheet').onclick = closeSheet;
}

/* ======================= KID (NFC CARD) VIEW ======================= */

async function routeKid() {
  if (kidUnlocked && kidData) {
    renderKidView();
    return;
  }
  let status;
  try {
    status = await apiCall({ action: 'checkStudent', studentId: viewStudentId });
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty">Couldn't check this card right now. Check your connection and reload.</div>`;
    return;
  }
  if (!status.exists) {
    document.getElementById('main').innerHTML = `<div class="empty">This card isn't linked to a student yet. Check with your teacher.</div>`;
    return;
  }
  renderKidPinScreen(!status.hasPin);
}

function renderKidPinScreen(isFirstTime) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="lock-view">
      <p class="lock-label">${isFirstTime ? 'Choose a PIN' : 'Enter your PIN'}</p>
      <p class="lock-sub">${isFirstTime ? "This protects your points. Don't tell other students." : "Ask your teacher if you forgot it."}</p>
      <input type="password" inputmode="numeric" id="kidPinInput" class="pin-input" maxlength="8">
      <button id="kidPinSubmit" class="pin-submit">${isFirstTime ? 'Save PIN' : 'Unlock'}</button>
      <p class="pin-error" id="kidPinError" style="display:none;">Wrong PIN, try again.</p>
    </div>`;
  const input = document.getElementById('kidPinInput');
  input.focus();
  const submit = () => withBusy(async () => {
    if (!input.value) return;
    const result = await apiCall({ action: 'verifyStudentPin', studentId: viewStudentId, pin: input.value });
    if (result.ok) {
      kidUnlocked = true;
      kidData = result.data;
      renderKidView();
    } else {
      document.getElementById('kidPinError').style.display = 'block';
      input.value = '';
      input.focus();
    }
  });
  document.getElementById('kidPinSubmit').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

function renderKidView() {
  const main = document.getElementById('main');

  let shopHtml = '';
  if (kidData.shopItems.length) {
    shopHtml = `<div class="kid-shop-title">You can spend points on</div><div class="kid-shop-list">`;
    kidData.shopItems.forEach(item => {
      const can = kidData.points >= item.cost;
      const alreadyRequested = kidData.myRequests.some(r => r.itemId === item.id);
      shopHtml += `<div class="kid-shop-row">
        <span class="kn">${escapeHtml(item.name)}</span>
        <span class="kc">${item.cost} pts</span>
        <button class="kid-req-btn" data-request="${item.id}" ${(!can || alreadyRequested) ? 'disabled' : ''}>${alreadyRequested ? 'Asked' : 'Request'}</button>
      </div>`;
    });
    shopHtml += `</div>`;
  }

  let reqHtml = '';
  if (kidData.myRequests.length) {
    reqHtml = `<div class="kid-shop-title" style="margin-top:22px;">Waiting on your teacher</div><div class="kid-requests-list">`;
    kidData.myRequests.forEach(r => {
      const item = kidData.shopItems.find(i => i.id === r.itemId);
      reqHtml += `<div class="kid-req-row">
        <span class="kw">${escapeHtml(item ? item.name : 'Item')}</span>
        <button class="kid-cancel-btn" data-cancel="${r.id}">Cancel</button>
      </div>`;
    });
    reqHtml += `</div>`;
  }

  main.innerHTML = `
    <div class="kid-view">
      <p class="kid-name">${escapeHtml(kidData.name)}</p>
      <div class="kid-points">${kidData.points}</div>
      <div class="kid-points-label">points</div>
      ${shopHtml}
      ${reqHtml}
      <p class="kid-note">Requests need your teacher's approval before points are spent.</p>
    </div>`;

  main.querySelectorAll('[data-request]').forEach(btn => {
    btn.onclick = () => withBusy(async () => {
      const itemId = btn.getAttribute('data-request');
      kidData = await apiCall({ action: 'requestRedeem', studentId: viewStudentId, itemId });
      renderKidView();
      showToast('Sent to your teacher');
    });
  });

  main.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.onclick = () => withBusy(async () => {
      const id = btn.getAttribute('data-cancel');
      kidData = await apiCall({ action: 'cancelRequest', studentId: viewStudentId, id });
      renderKidView();
      showToast('Request cancelled');
    });
  });
}

loadState();
</script>
</body>
</html>
